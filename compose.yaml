services:
  web: 
    build:
      context: ./client
      target: dev
      args:
        VITE_API_URL: http://localhost:5000
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:5000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 100
    depends_on:
      - api

  api:

    build:
      context: ./server
      target: dev
    working_dir: /app
    command: npm run dev -- --legacy-watch

    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
    volumes:
      - ./server:/app
      - /app/node_modules
